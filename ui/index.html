<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>decidus</title>
<style>
:root{
  --ground:#F3F2EF;--surface:#FBFAF8;--sunken:#ECEBE7;
  --ink:#1B1E21;--ink2:#5B6167;--ink3:#8C9298;
  --line:#DEDCD6;--line2:#E9E7E2;
  --accent:#2B5876;--accent-ink:#FFFFFF;--accent-tint:#E4ECF1;
  --rust:#9A4829;--pass:#2F6B4A;--pass-tint:#E3EFE7;--fail:#A63D2A;--fail-tint:#F5E4DF;
  --add:#E6EEF3;--del:#F6E9E5;
  --jk:#1F6096;--str:#2E6B45;--num:#9A4829;--lit:#6B4FA0;
  --idle:#9AA0A6;--hatch:rgba(27,30,33,.065);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --ground:#15181B;--surface:#1B1F23;--sunken:#23282D;
  --ink:#E6E8EA;--ink2:#9CA3AA;--ink3:#6C747B;--line:#2D3237;--line2:#252A2F;
  --accent:#86B3D3;--accent-ink:#0F1A22;--accent-tint:#1F2C36;
  --rust:#DB8F6E;--pass:#74BD92;--pass-tint:#1C2C23;--fail:#E88E78;--fail-tint:#33211C;
  --add:rgba(134,179,211,.10);--del:rgba(232,142,120,.10);
  --jk:#8CC0EA;--str:#9ED0AE;--num:#DB8F6E;--lit:#B9A3E0;
  --idle:#6C747B;--hatch:rgba(255,255,255,.07);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.fill{flex:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{flex:none;display:flex;align-items:center;gap:16px;height:48px;padding-inline:20px;border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:14px;height:14px;border-radius:4px;background:var(--ink);flex:none}
.brand{font-weight:600}
.sep{color:var(--ink3)}
#crumbs{display:flex;align-items:center;gap:10px;min-width:0}
.crumb{border:0;background:transparent;padding:4px 6px;margin:0 -6px;border-radius:6px;color:var(--ink2);cursor:pointer}
.crumb:hover{background:var(--sunken);color:var(--ink)}
.scope{height:28px;max-width:240px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font:12px var(--mono);cursor:pointer}
.minfo{margin-left:auto;display:flex;gap:12px;font:12px var(--mono);color:var(--ink2);white-space:nowrap}
.minfo b{color:var(--ink);font-weight:500}

/* overview */
.ov{flex:1;overflow:auto}
.ov-in{max-width:1180px;margin:0 auto;padding:40px 24px 64px}
h1{margin:0 0 20px;font-size:22px;font-weight:600;letter-spacing:-.01em}
.ptable{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.ph-row,.pr{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) 70px 132px 118px 64px 76px 60px;gap:16px;align-items:center;padding:0 20px}
.ph-row{height:40px;font-size:12px;color:var(--ink2);border-bottom:1px solid var(--line2)}
.pr{width:100%;min-height:64px;border:0;border-bottom:1px solid var(--line2);background:transparent;text-align:left;cursor:pointer}
.pr:last-child{border-bottom:0}
.pr:hover{background:var(--sunken)}
.pcell{display:flex;flex-direction:column;min-width:0}
.pcell .mono{font-size:14px;font-weight:500;overflow-wrap:anywhere}
.pi{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{text-align:right;font-variant-numeric:tabular-nums}
.hot{color:var(--rust);font-weight:500}
.okc{color:var(--pass)}.badc{color:var(--fail)}
.calls{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.spark{display:block;fill:var(--line)}
.spark rect:last-child{fill:var(--accent)}
.agr{display:flex;flex-direction:column;align-items:flex-end;font:13px var(--mono)}
.agr small{font-size:11px;color:var(--ink3)}
.empty{padding:20px 16px;font-size:13px;color:var(--ink3)}
.start{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:24px}
.start h2{margin:0 0 6px;font-size:15px}
pre.code{margin:12px 0 0;padding:14px 16px;border-radius:8px;background:var(--sunken);font:12.5px/20px var(--mono);overflow:auto}

/* policy screen */
.app{flex:1;min-height:0;display:grid;grid-template-columns:360px minmax(0,1fr) 480px}
.pane{min-height:0;overflow:auto;border-right:1px solid var(--line);display:flex;flex-direction:column}
.pane:last-child{border-right:0}
.ph{position:sticky;top:0;z-index:1;flex:none;display:flex;align-items:center;gap:10px;min-height:44px;padding-inline:12px 16px;background:var(--ground);border-bottom:1px solid var(--line2);font-size:13px}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{height:32px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--ink2);font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.tab:hover{background:var(--sunken)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tab .ct{font:12px var(--mono);color:var(--ink3)}
.tab.v{font:12px var(--mono);min-width:36px;justify-content:center;padding:0 8px}
.tab.v.own{color:var(--accent)}
.tab.sug{border:1px dashed var(--accent);color:var(--accent)}
.tab.sug[aria-selected="true"]{box-shadow:none;background:var(--accent-tint)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--pass);display:inline-block;flex:none}

.rows{flex:1}
.sec{display:flex;align-items:center;gap:8px;height:36px;padding:0 16px 0 14px;background:var(--sunken);border-bottom:1px solid var(--line2);font-size:12px;font-weight:600}
.sec .n{font:12px var(--mono);font-weight:400;color:var(--ink3)}
.win{display:flex;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line2);font:11px/16px var(--mono);color:var(--ink3)}
.grp{display:flex;align-items:center;gap:8px;height:32px;padding:10px 16px 0 14px;font:12px var(--mono);color:var(--ink2);border-bottom:1px solid var(--line2);box-sizing:content-box}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding-inline:16px 12px;border-bottom:1px solid var(--line2)}
.row.pick{grid-template-columns:18px minmax(0,1fr);padding-left:14px}
.row:hover{background:var(--sunken)}
.row.on{background:var(--surface);box-shadow:inset 2px 0 0 var(--ink)}
.rb{display:block;padding:9px 4px 9px 0;border:0;background:transparent;text-align:left;cursor:pointer;min-width:0;width:100%}
.r-t{font-size:13px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-m{font:11px/16px var(--mono);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-m .ans{color:var(--rust)}
.r-m .ok{color:var(--pass)}
.r-m .cat{color:var(--ink);font-weight:500}
.r-m .sc{color:var(--accent)}
.qb{width:32px;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink2);display:grid;place-items:center;cursor:pointer}
.qb:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qb svg{width:14px;height:14px}
.ck{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer}
.filter{position:sticky;top:44px;z-index:1;padding:10px 12px;background:var(--ground);border-bottom:1px solid var(--line2)}
.filter input{width:100%;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:12px var(--mono)}
.more{display:block;width:100%;height:40px;border:0;border-bottom:1px solid var(--line2);background:transparent;color:var(--ink2);font-size:13px;cursor:pointer}
.more:hover{background:var(--sunken);color:var(--ink)}
.foot{position:sticky;bottom:0;flex:none;padding:12px 16px 16px;background:var(--ground);border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:8px}
.linkbtn{border:0;background:transparent;padding:0;font-size:12px;font-weight:400;color:var(--ink2);cursor:pointer}
.linkbtn:hover{color:var(--ink)}
.primary{height:40px;padding:0 16px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.primary.w{width:100%}
.primary:disabled{background:var(--sunken);color:var(--ink3);cursor:not-allowed}
.primary.busy:disabled{background:var(--accent);color:var(--accent-ink);opacity:.85;cursor:progress}
.ghost{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:transparent;display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13px}
.ghost:hover{background:var(--sunken)}
.ghost:disabled{color:var(--ink3);cursor:not-allowed;background:transparent}
.ghost.tune{border-color:var(--accent);color:var(--accent)}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.err{margin:12px 16px 0;padding:10px 12px;border-radius:8px;background:var(--fail-tint);color:var(--fail);font-size:13px}

.d{padding:20px;display:flex;flex-direction:column;gap:16px}
.d-meta{font:12px/18px var(--mono);color:var(--ink2);overflow-wrap:anywhere}
.decide{display:flex;flex-direction:column;gap:12px;padding:14px 16px;border:1px solid var(--line2);border-radius:10px;background:var(--surface)}
.said{font:12px/18px var(--mono);color:var(--rust)}
.said.sure{color:var(--pass)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.sg{position:relative;height:38px;padding:0 14px 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.sg kbd{font:10px/16px var(--mono);min-width:16px;padding:0 3px;border:1px solid var(--line);border-radius:4px;color:var(--ink3);text-align:center}
.sg:hover{background:var(--sunken)}
.sg.mp{border-style:dashed;border-color:var(--rust)}
.sg.mp::after{content:"model";position:absolute;top:-8px;right:8px;padding:0 3px;background:var(--surface);font:10px/14px var(--mono);color:var(--rust)}
.sg[aria-pressed="true"]{background:var(--ink);border:1px solid var(--ink);color:var(--ground)}
.sg[aria-pressed="true"] kbd{border-color:transparent;color:inherit;opacity:.6}
.sg:disabled{cursor:default}
.savebar{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}
.savebar .primary{height:34px;font-size:13px}
.savebar kbd{font:10px var(--mono);opacity:.7}
.sg:disabled:not([aria-pressed="true"]){color:var(--ink3);background:transparent}
.blk{border:1px solid var(--line2);border-radius:10px;background:var(--surface)}
.bh{display:flex;align-items:center;gap:10px;height:40px;padding:0 16px;border-bottom:1px solid var(--line2);font-size:13px;font-weight:500}
.bh .mono{font-size:12px;font-weight:400;color:var(--ink2)}
.bb{padding:10px 16px}
.jl{display:block;font:12.5px/21px var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.jl .k0{color:var(--ink);font-weight:500}.jl .k{color:var(--jk)}.jl .s{color:var(--str)}.jl .n{color:var(--num)}.jl .b{color:var(--lit)}.jl .pn{color:var(--ink3)}

.code{font:12.5px/22px var(--mono);padding-block:10px}
.ref{font:500 11px/16px var(--mono);padding:0 5px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--accent);cursor:pointer}
.edit{display:flex;flex-direction:column;gap:12px;padding:12px 16px}
.edit label{display:flex;flex-direction:column;gap:4px;font:12px var(--mono);color:var(--jk)}
.edit textarea{min-height:64px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:12.5px/20px var(--mono);resize:vertical}
.notes{margin:0 16px 8px;padding:10px 12px;border-radius:8px;background:var(--sunken);font-size:12.5px;color:var(--ink2)}
.notes.code0{white-space:pre-wrap;font:12px/18px var(--mono)}
.notes b{font:500 12px var(--sans);color:var(--ink)}
.stat{padding:0 16px 4px;font:12px var(--mono);color:var(--ink2)}
.stat b{font-weight:500;color:var(--ink)}
.sugbar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px}
.sugbar button{white-space:nowrap}
.sugbar .primary{height:36px;font-size:13px}
.replay{border-top:1px solid var(--line2);padding:16px;display:flex;flex-direction:column;gap:12px}
.r-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.r-btns{display:flex;gap:8px;flex-wrap:wrap}
.r-sum{font:13px var(--mono);color:var(--ink2)}
.r-sum b{font-weight:500;color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:5px}
.tile{height:30px;border:1px solid var(--line2);border-radius:6px;background:transparent;font:11px var(--mono);color:var(--ink3);cursor:pointer;padding:0}
.tile.pass{background:var(--pass-tint);border-color:transparent;color:var(--pass)}
.tile.fail{background:var(--fail-tint);border-color:var(--fail);color:var(--fail);font-weight:500}
.tlog{list-style:none;margin:0;padding:10px 0 0;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:6px}
.tlog li{display:grid;grid-template-columns:18px 48px minmax(0,1fr);gap:8px;font-size:12px;line-height:18px;color:var(--ink2)}

.notes.warn{color:var(--rust)}
.ph+.notes,.ph+.err+.notes{margin-top:12px}
.notes .linkbtn{color:inherit;text-decoration:underline;text-underline-offset:2px}
.notes .mono{font-size:12px}
.ofilter{width:100%;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--ground);font:12px var(--mono)}
.tab .ct{margin-left:2px}

.gate{max-width:420px;margin:15vh auto;padding:24px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.gate input{height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--ground);color:var(--ink);font:13px var(--mono)}

@media (max-width:1100px){
  body{display:block;height:auto}
  .bar{height:auto;min-height:48px;padding-block:8px}
  .crumbs,#crumbs{flex-wrap:wrap;row-gap:6px}
  .scope{max-width:calc(100vw - 40px)}
  .minfo{display:none}
  .app{grid-template-columns:minmax(0,1fr)}
  .pane{overflow:visible;border-right:0;border-bottom:1px solid var(--line)}
  .ph,.foot,.filter{position:static}
  .ph-row{display:none}
  .pr{grid-template-columns:minmax(0,1fr) auto;padding:12px 16px}
  .pr>:not(:first-child):not(:nth-child(6)){display:none}
}

/* 0.5 pane: versions like Cloud Run revisions, the text as JSON (raw · Diff · Tuneable), replay */
.rev{width:100%;border-collapse:collapse;font-size:13px}
.rev th{position:sticky;top:0;z-index:1;height:44px;font-weight:500;color:var(--ink2);text-align:left;padding:0 8px;background:var(--ground);border-bottom:1px solid var(--line2);white-space:nowrap}
.rev td{padding:0 8px;height:40px;border-bottom:1px solid var(--line2);white-space:nowrap}
.rev tbody tr{cursor:pointer}
.rev tbody tr:hover td{background:var(--surface)}
.rev tbody tr.on td{background:var(--sunken)}
.rev th:first-child,.rev td:first-child{padding-left:16px;width:34px}
.rev th:nth-child(2),.rev td:nth-child(2){width:28px;padding-left:2px}
.rev .num{text-align:right;width:70px}
.rev .when{color:var(--ink2);width:76px;padding-right:16px}
.radio{display:inline-block;width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink3);vertical-align:middle}
tr.on .radio{box-shadow:inset 0 0 0 1.5px var(--accent),inset 0 0 0 4.5px var(--surface);background:var(--accent)}
.st{display:inline-flex;vertical-align:middle}
.vn{font:12.5px var(--mono)}
.vtag{margin-left:8px;font-size:11px;color:var(--ink3)}
.pc{border:0;background:none;padding:3px 6px;margin-right:-6px;border-radius:6px;font-variant-numeric:tabular-nums;cursor:text;color:var(--ink);font-size:13px}
.pc:hover{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.pc:disabled{cursor:default;background:none;box-shadow:none}
.pc.zero{color:var(--ink3)}
.pc input{width:46px;border:0;outline:0;background:none;text-align:right;padding:0;font:inherit;font-variant-numeric:tabular-nums}
.pc.edit{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--accent);display:inline-block}
.dash{color:var(--ink3)}
.jbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:8px 16px;margin-top:4px;border-bottom:1px solid var(--line2);font-size:12.5px;color:var(--ink3);white-space:nowrap}
.jbar .v{font:600 12.5px var(--mono);color:var(--ink);margin-right:6px}
.jbar .linkbtn{margin-left:12px}
.flt{height:28px;padding:0 10px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--ink2);font-size:12.5px;cursor:pointer}
.flt:hover{background:var(--sunken)}
.flt.on{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:500}
.flt:disabled{color:var(--ink3);cursor:not-allowed;background:none}
.jx{position:relative;padding:12px 0 14px;font:12.5px/1.75 var(--mono)}
.jr{display:grid;grid-template-columns:40px minmax(0,1fr);padding-right:16px}
.jx.refd .jr{grid-template-columns:40px minmax(0,1fr) 88px}
.jn{color:var(--ink3);text-align:right;padding-right:14px;user-select:none;-webkit-user-select:none}
.jc{white-space:pre-wrap;overflow-wrap:anywhere;padding-left:4ch;text-indent:-2ch}
.jc.top{padding-left:0;text-indent:0}
.jx .s{color:var(--ink)}
.jx ins{text-decoration:none;background:var(--pass-tint);color:var(--pass)}
.jx del{text-decoration:line-through;text-decoration-thickness:1px;background:var(--fail-tint);color:var(--fail)}
.jx del+ins{margin-left:2px}
.rg{position:absolute;right:12px;width:80px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:3px}
.own,.lock{border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.own.hov{background:var(--sunken)}
.lock{color:var(--ink3);background:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 5px)}
.lock.hov{color:var(--ink2)}
.lki{display:inline-block;width:9px;height:11px;margin-right:4px;vertical-align:-1px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;padding:0 16px 12px 56px;font-size:12px;color:var(--ink3)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg .aa{font:600 11px var(--sans);color:var(--ink)}
.leg .ref{cursor:default;font-style:normal}
.ref.ref-more{color:var(--ink3);cursor:default}
.sw{display:inline-block;width:14px;height:11px;border-radius:2px}
.sw.s-a{background:var(--pass-tint);box-shadow:inset 0 0 0 1px var(--pass)}
.sw.s-d{background:var(--fail-tint);box-shadow:inset 0 0 0 1px var(--fail)}
.sw.s-lk{background:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 4px);box-shadow:inset 0 0 0 1px var(--line)}
.tip{position:fixed;z-index:20;width:330px;max-width:calc(100vw - 24px);padding:11px 13px;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.16);font-size:12.5px;line-height:1.5;color:var(--ink2);pointer-events:none}
.tip h5{margin:0 0 5px;font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
.tip .kv{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 10px;margin-top:6px}
.tip .kv>span:nth-child(odd){color:var(--ink3);font-size:11.5px;padding-top:1px}
.tip .q{font:11.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.tip del{background:var(--fail-tint);color:var(--fail);text-decoration-thickness:1px}
.pane#policy .err{margin:12px 16px 0}

.filter{display:flex;gap:8px;align-items:center}
.filter input{flex:1;min-width:0}
.rvw{flex:none;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink2);font-size:12.5px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.rvw:hover{color:var(--ink)}
.rvw[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-tint)}
.rvw .ct{font:11px var(--mono);color:inherit;opacity:.8}
.jbar .save{margin-left:12px;height:28px;padding:0 12px;border:0;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.jbar .save:disabled{opacity:.6;cursor:default}
.rev tbody tr.saved td{animation:saved 1.8s ease-out}
.rev tbody tr:has(+ tr.trial) td{border-bottom:0}
.rev tbody tr.trial{cursor:default}
.rev tbody tr.trial td{height:auto;padding:0 8px 9px;font-size:12px;color:var(--ink2);white-space:normal;background:none}
.rev tbody tr.trial .linkbtn{font-size:12px}
.inherit{display:flex;gap:10px;align-items:center;padding:10px 16px;font-size:12.5px;color:var(--ink2);border-bottom:1px solid var(--line2)}
@keyframes saved{0%,35%{background:var(--accent-tint)}}
</style>
</head>
<body>
<header class="bar">
  <div class="crumbs"><span class="mark" aria-hidden="true"></span><span class="brand">decidus</span><span class="sep">·</span><span id="crumbs"></span></div>
  <div class="minfo" id="minfo"></div>
</header>
<main class="ov" id="ov"></main>
<main class="app" id="app" hidden>
  <section class="pane" id="list" aria-label="Cases"></section>
  <section class="pane" id="detail" aria-label="Case"></section>
  <section class="pane" id="policy" aria-label="Policy"></section>
</main>
<main id="gate" hidden></main>
<div class="tip" id="tip" hidden></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const fmt = n => Number(n || 0).toLocaleString("en");
  const pct = (a, n) => n ? Math.round(a / n * 100) + "%" : "—";
  const ICON = {
    A:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>',
    play:'<svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>'
  };
  const keep = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k,v) => { try { localStorage.setItem(k,v); } catch {} } };

  const S = { multi:new Set(), view:"list", name:null, scope:"", data:null, tab:"calls", review:false, cur:null, caseView:null, sel:null, pick:new Set(), pickAll:false,
    busy:null, error:null, overview:null, calls:{ q:"", rows:null, next:null }, editing:null, editSample:null, text:null, ofilter:"", copied:false, mode:"raw", views:{}, pctEdit:null };

  async function api(path, body) {
    const key = keep.get("decidus_key");
    const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "content-type":"application/json", ...(key ? { authorization:`Bearer ${key}` } : {}) }, body: body ? JSON.stringify(body) : undefined });
    if (r.status === 401) { gate(); throw new Error("unauthorised"); }
    if (!(r.headers.get("content-type") || "").includes("json"))
      throw new Error(`${path.split("?")[0]} answered HTTP ${r.status} without JSON: open this page from decidus serve (http://localhost:7700), not as a file or from another server`);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    return j;
  }
  const P = (suffix = "") => `/api/policies/${encodeURIComponent(S.name)}${suffix}`;
  const scoped = path => path + (S.scope ? (path.includes("?") ? "&" : "?") + "scope=" + encodeURIComponent(S.scope) : "");
  const post = (action, body = {}) => api(P("/" + action), { ...body, scope: S.scope });

  function gate() {
    $("ov").hidden = true; $("app").hidden = true; $("gate").hidden = false;
    $("gate").innerHTML = '<form class="gate" id="gf"><b>API key</b><span class="muted" style="font-size:13px">This decidus server needs the key set in DECIDUS_API_KEY.</span><input id="gk" type="password" autocomplete="off" aria-label="API key"><button class="primary">Continue</button></form>';
    $("gf").onsubmit = e => { e.preventDefault(); keep.set("decidus_key", $("gk").value.trim()); $("gate").hidden = true; route(); };
  }

  const lab = o => {
    if (typeof o === "string" && o.startsWith("[")) { try { const a = JSON.parse(o); return a.length ? a.join(", ") : "none"; } catch {} }
    return o === "true" ? "Yes" : o === "false" ? "No" : o;
  };
  const set = v => { try { const a = JSON.parse(v); return Array.isArray(a) ? a : []; } catch { return []; } };
  const ago = iso => { const s = (Date.now() - new Date(iso)) / 1000; return s < 60 ? "just now" : s < 3600 ? Math.round(s/60)+"m ago" : s < 86400 ? Math.round(s/3600)+"h ago" : new Date(iso).toLocaleDateString(); };

  // ---------------- JSON ----------------
  function hl(obj) {
    return JSON.stringify(obj, null, 2).split("\n").map(line => {
      const depth = line.match(/^ */)[0].length / 2;
      const body = esc(line.trimStart()).replace(/(&quot;(?:\\.|[^\\])*?&quot;)(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:e[+-]?\d+)?|[{}\[\],]/g, (m, s, colon, lit) => {
        if (s && colon) return `<span class="${depth <= 1 ? "k0" : "k"}">${s}</span><span class="pn">:</span>`;
        if (s) return `<span class="s">${s}</span>`;
        if (lit) return `<span class="b">${m}</span>`;
        if (/^[{}\[\],]$/.test(m)) return `<span class="pn">${m}</span>`;
        return `<span class="n">${m}</span>`;
      });
      return `<span class="jl" style="padding-left:${depth*2}ch">${body}</span>`;
    }).join("");
  }
  const block = (label, meta, obj) => `<section class="blk"><div class="bh">${label}<span class="fill"></span>${meta}</div><div class="bb">${obj == null ? '<span class="muted">No longer stored</span>' : hl(obj)}</div></section>`;

  // ---------------- routing: #/p/<name>?scope=<scope> ----------------
  function route() {
    const m = location.hash.match(/^#\/p\/([^?]+)(?:\?(.*))?$/);
    if (m) {
      const name = decodeURIComponent(m[1]), scope = new URLSearchParams(m[2] || "").get("scope") || "";
      S.view = "policy";
      if (S.name !== name || S.scope !== scope) {
        if (S.name !== name) S.tab = "calls";
        Object.assign(S, { name, scope, data:null, cur:null, caseView:null, sel:null, pickAll:false, error:null, editing:null, text:null, calls:{ q:S.calls.q, rows:null, next:null } });
        S.pick.clear();
      }
    } else { S.view = "list"; S.name = null; }
    refresh();
  }
  window.addEventListener("hashchange", route);
  const go = (name, scope) => { location.hash = "#/p/" + encodeURIComponent(name) + (scope ? "?scope=" + encodeURIComponent(scope) : ""); };

  async function load() {
    S.data = await api(scoped(P()));
    const d = S.data;
    if (S.sel == null || (S.sel === "S" && !d.draft) || (S.sel !== "S" && !d.versions.some(v => v.n === S.sel)))
      S.sel = d.draft ? "S" : d.candidate && d.versions.some(v => v.n === d.candidate.n) ? d.candidate.n : d.effective.n;
    await loadText();
  }
  // the selected version (or draft) merged into the text your code sends now
  async function loadText() { await loadViews(); }
  async function refresh(poll) {
    try {
      if (S.view === "list") { S.overview = await api("/api/overview"); renderOverview(); return; }
      await load();
      if (S.tab === "calls" && !S.calls.rows) await loadCalls();
      if (!S.cur) { const first = S.tab === "calls" ? invocations()[0] : S.data.unprocessed[0]; if (first) await open(first.id, false); }
      renderPolicy(poll);
    } catch (e) {
      if (e.message === "unauthorised") return;
      console.error(e);
      if (!S.overview && !S.data) { $("ov").hidden = false; $("ov").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }   // nothing loaded yet: say why on the page
    }
  }
  setInterval(() => { if (!S.busy && !S.editing && document.visibilityState === "visible" && !/^(INPUT|SELECT)$/.test(document.activeElement?.tagName)) refresh(true); }, 4000);

  // ---------------- overview ----------------
  function spark(arr) {
    const w = 5, gap = 2, h = 20, max = Math.max(1, ...arr), W = arr.length * (w + gap) - gap;
    return `<svg class="spark" width="${W}" height="${h}" viewBox="0 0 ${W} ${h}" aria-hidden="true">${arr.map((v, i) => { const y = v ? Math.max(2, Math.round(v / max * h)) : 1; return `<rect x="${i * (w + gap)}" y="${h - y}" width="${w}" height="${y}" rx="1"/>`; }).join("")}</svg>`;
  }
  function agreement(list) {
    const seen = list.filter(a => a.n > 0);
    if (!seen.length) return '<span class="agr muted">—</span>';
    const a = seen[0], b = seen.at(-1);
    if (a === b) return `<span class="agr"><span>${pct(a.agree, a.n)}</span><small>v${a.v} · ${fmt(a.n)}</small></span>`;
    const up = b.agree / b.n >= a.agree / a.n;
    return `<span class="agr" title="People agreed with the model on reviewed cases"><span><span class="muted">${pct(a.agree, a.n)} →</span> <span class="${up ? "okc" : "badc"}">${pct(b.agree, b.n)}</span></span><small>v${a.v} → v${b.v}</small></span>`;
  }
  function renderOverview() {
    $("ov").hidden = false; $("app").hidden = true;
    $("crumbs").innerHTML = '<span>Policies</span>'; $("minfo").innerHTML = "";
    const rows = S.overview;
    if (!rows.length) {
      $("ov").innerHTML = `<div class="ov-in"><h1>Policies</h1><div class="start"><h2>No decisions yet</h2>
        <span class="muted">Add one option to the client you already use. Decision calls show up here as policies: structured outputs, function calls forced to one tool, OpenAI Decisions and Jev.</span>
        <pre class="code">import * as decidus from "decidus";

const openai = new OpenAI({ fetch: decidus.fetch() });
const claude = new Anthropic({ fetch: decidus.fetch() });</pre></div></div>`;
      return;
    }
    $("ov").innerHTML = `<div class="ov-in"><h1>Policies</h1><div class="ptable">
      <div class="ph-row"><span>Policy</span><span>Model</span><span>Live</span><span class="num">Calls · 14 days</span><span class="num">Agreement</span><span class="num">To review</span><span class="num">To process</span><span class="num">Replay</span></div>
      ${rows.map(p => `<button type="button" class="pr" data-open="${esc(p.name)}">
        <span class="pcell"><span class="mono">${esc(p.name).replace(/\./g, ".<wbr>")}</span><span class="pi">${esc(p.instructions || "")}</span></span>
        <span class="pcell"><span class="mono" style="font-size:13px">${esc(p.model || "—")}</span><span class="pi">${esc(p.route)} · ${esc(p.kind)}</span></span>
        <span class="pcell"><span class="mono" style="font-size:13px">${p.live ? '<i class="dot"></i> ' : ""}v${p.live}</span>${p.candidates?.length ? `<span class="pi">${p.candidates.map(c => `v${c.n} ${esc(c.mode)} ${c.pct}%`).join(" · ")}</span>` : p.overrides ? `<span class="pi">+${p.overrides} scoped</span>` : ""}</span>
        <span class="calls">${spark(p.daily)}<span class="mono">${fmt(p.calls)}</span></span>
        ${agreement(p.agreement)}
        <span class="mono num ${p.queue ? "hot" : ""}">${fmt(p.queue)}</span>
        <span class="mono num">${fmt(p.unprocessed)}</span>
        <span class="mono num">${p.replay ? `<span class="${p.replay.pass === p.replay.n ? "okc" : "badc"}">${p.replay.pass}/${p.replay.n}</span>` : '<span class="muted">—</span>'}</span>
      </button>`).join("")}</div></div>`;
  }

  // ---------------- policy screen ----------------
  const sure = c => c.confidence != null && (c.confidence >= .8 || c.confidence <= .2);
  const said = c => c.answer == null ? "no answer" : `${lab(c.answer)}${c.confidence != null ? " " + Number(c.confidence).toFixed(2) : ""}`;
  const scopeTag = c => c.scope && c.scope !== S.scope ? ` · <span class="sc">${esc(S.scope ? c.scope.slice(S.scope.length + 1) : c.scope)}</span>` : "";
  const shadowTag = c => c.shadow_version != null && c.shadow_answer !== c.answer ? ` · <span class="sc" title="Shadow v${esc(c.shadow_version)} diverged on this call">v${esc(c.shadow_version)}: ${esc(lab(c.shadow_answer ?? "–"))}</span>` : "";
  const rowsNow = () => S.tab === "calls" ? invocations() : [...S.data.unprocessed, ...S.data.processed];

  function renderPolicy(poll) {
    $("ov").hidden = true; $("app").hidden = false;
    const d = S.data, p = d.policy;
    const opts = d.scopes.length ? `<select class="scope" id="scope" aria-label="Scope"><option value="">All scopes</option>${d.scopes.map(s => {
      const o = d.overrides.find(x => x.scope === s);
      return `<option value="${esc(s)}"${s === S.scope ? " selected" : ""}>${esc(s)}${o?.live != null ? " · v" + o.live : ""}</option>`;
    }).join("")}</select>` : "";
    $("crumbs").innerHTML = `<button class="crumb" id="home">Policies</button><span class="sep">/</span><span class="mono">${esc(p.name)}</span>${opts ? '<span class="sep">/</span>' + opts : ""}`;
    $("minfo").innerHTML = `<span>${esc(p.kind)}</span><b>${esc(p.model || "")}</b><span>${esc(p.route)}</span>`;
    if (!(poll && S.tab === "calls")) renderList();
    renderDetail(); renderPane();
  }

  function caseRow(c, on) {
    return `<div class="row${on}"><button class="rb" data-case="${c.id}"><div class="r-t">${esc(c.headline || "(no text)")}</div>
      <div class="r-m">#${c.id} · <span class="${sure(c) ? "ok" : "ans"}">${esc(said(c))}</span> · v${esc(c.version)}${shadowTag(c)}${scopeTag(c)} · ${ago(c.created_at)}</div></button>
      ${c.answer != null && c.decision == null ? `<button class="qb" data-ok="${c.id}" title="Agree with ${esc(lab(c.answer))} (Enter)" aria-label="Agree with ${esc(lab(c.answer))} for #${c.id}">${ICON.A}</button>` : ""}</div>`;
  }

  function renderList() {
    const d = S.data, t = d.tally, on = id => S.cur === id ? " on" : "";
    const tab = (k, l, n) => `<button class="tab" data-tab="${k}" aria-selected="${S.tab === k}">${l}${n != null ? ` <span class="ct">${fmt(n)}</span>` : ""}</button>`;
    let h = `<div class="ph"><div class="tabs">${tab("calls","Invocations",t.calls)}${tab("decided","Decided",t.unprocessed + t.processed)}</div></div>`;

    if (S.tab === "calls") {
      h += `<div class="filter"><input id="cq" value="${esc(S.calls.q)}" placeholder="Filter · answer:refund  v:2  conv_…" aria-label="Filter invocations" autocomplete="off" spellcheck="false">
        <button class="rvw" id="review" aria-pressed="${S.review}" title="Only what you haven't decided, the cases the model is least sure of first">To review <span class="ct">${fmt(t.queue)}</span></button></div>`;
      const rows = S.calls.rows == null ? null : invocations();
      const left = rows?.filter(c => c.decision == null).length;
      if (S.review && rows) h += `<div class="win"><span>${left ? `${left} undecided` : "All reviewed"}</span><span class="fill"></span><span title="Calls a shadow answered differently first, then the model's own doubt, then answers people often correct">least certain first</span></div>`;
      h += `<div class="rows">` + (rows == null ? '<div class="empty">Loading…</div>' : rows.length ? rows.map(c => invRow(c, on(c.id))).join("")
        + (S.calls.next && !S.review ? '<button class="more" id="more">Older invocations</button>' : "") : `<div class="empty">${S.review ? "Nothing left to review" : "No invocations match"}</div>`);
      $("list").innerHTML = h + "</div>"; return;
    }

    const un = d.unprocessed, pr = d.processed;
    const row = c => `<div class="row pick${on(c.id)}">${c.used_in == null ? `<input type="checkbox" class="ck" data-pick="${c.id}" aria-label="Use #${c.id}"${S.pickAll || S.pick.has(c.id) ? " checked" : ""}>` : "<span></span>"}
      <button class="rb" data-case="${c.id}"><div class="r-t">${esc(c.headline || "(no text)")}</div><div class="r-m"><span class="cat">${esc(lab(c.decision))}</span>${c.answer !== c.decision ? ` · <span class="ans">model ${esc(lab(c.answer ?? "–"))}</span>` : ""} · #${c.id}${scopeTag(c)} · ${ago(c.decided_at)}</div></button></div>`;
    h += `<div class="rows"><div class="sec"><span>Unprocessed</span><span class="n">${fmt(t.unprocessed)}</span><span class="fill"></span>${un.length && !S.pickAll ? '<button class="linkbtn" id="pickAll">Select all</button>' : ""}</div>`;
    h += un.length ? un.map(row).join("") : '<div class="empty">Nothing waiting</div>';
    h += `<div class="sec"><span>Processed</span><span class="n">${fmt(t.processed)}</span></div>`;
    const byV = {}; pr.forEach(c => (byV[c.used_in] ??= []).push(c));
    h += pr.length ? Object.keys(byV).sort((a,b) => b-a).map(v => `<div class="grp"><span>v${v}</span>${+v === d.effective.n ? '<i class="dot"></i>' : ""}<span class="fill"></span><span>${byV[v].length}</span></div>` + byV[v].map(row).join("")).join("") : '<div class="empty">No versions yet</div>';
    h += "</div>";
    const n = S.pickAll ? Math.min(t.unprocessed, d.maxCases) : S.pick.size, busy = S.busy === "suggest";
    const label = S.pickAll && t.unprocessed > d.maxCases ? `Generate draft from ${n} · disagreements first` : `Generate draft from ${n}`;
    const obs = !d.template.ready;
    h += `<div class="foot"><button class="primary w${busy ? " busy" : ""}" id="suggest" ${n && !S.busy && !obs ? "" : "disabled"}${obs ? ` title="Sampling ${d.template.seen}/${d.template.need} calls to detect static vs dynamic text"` : ""}>${busy ? '<span class="spin"></span>Generating draft…' : label}</button></div>`;
    $("list").innerHTML = h;
  }

  // To review: the server lists undecided calls, the ones the model was least sure of first
  // what you decide in To review stays in place, ticked, until the list reloads, so nothing shifts under you
  const invocations = () => (S.calls.rows || []).filter(c => !S.review || c.decision == null || S.calls.kept?.has(c.id));
  function invRow(c, on) {
    return `<div class="row${on}"><button class="rb" data-case="${c.id}"><div class="r-t">${esc(c.headline || "(no text)")}</div>
      <div class="r-m">#${c.id} · ${c.decision != null ? `<span class="cat">✓ ${esc(lab(c.decision))}</span>` : `<span class="${sure(c) ? "ok" : "ans"}">${esc(said(c))}</span>`} · v${esc(c.version)}${shadowTag(c)}${scopeTag(c)} · ${c.status >= 400 ? `<span class="badc">HTTP ${esc(c.status)}</span>` : ago(c.created_at)}</div></button>
      ${c.answer != null && c.decision == null ? `<button class="qb" data-ok="${c.id}" title="Agree with ${esc(lab(c.answer))} (Enter)" aria-label="Agree with ${esc(lab(c.answer))} for #${c.id}">${ICON.A}</button>` : ""}</div>`;
  }
  async function loadCalls(more) {
    const qs = new URLSearchParams({ q: S.calls.q });
    if (S.review) qs.set("review", "1"); else qs.set("limit", "100");
    if (more && S.calls.next) qs.set("before", S.calls.next);
    const r = await api(scoped(P("/calls?" + qs)));
    S.calls.rows = more ? [...(S.calls.rows || []), ...r.calls] : r.calls;
    if (!more) S.calls.kept = new Set();
    S.calls.next = r.next;
  }

  async function open(id, render = true) {
    if (S.cur !== id) S.ofilter = "";
    S.cur = id; S.caseView = await api("/api/cases/" + id);
    S.multi = new Set(set(S.caseView.decision ?? S.caseView.answer ?? "[]"));
    if (render) { renderList(); renderDetail(); if (!S.editing) renderPane(); document.querySelector(".row.on")?.scrollIntoView({ block:"nearest" }); }
  }

  /** With many options (96 articles, 120 tags), a filter narrows the buttons; 1–9 pick from what's shown. */
  const shownOpts = c => { const q = S.ofilter.trim().toLowerCase(), all = opts(c); return all.length > 12 && q ? all.filter(o => lab(o).toLowerCase().includes(q)) : all; };
  function segHtml(c) {
    const p = S.data.policy, locked = c.used_in != null, list = shownOpts(c);
    if (!list.length) return '<span class="muted">No option matches</span>';
    return p.kind === "multi" ? `<div class="seg">${list.map((o, i) => `<button class="sg${set(c.answer).includes(o) ? " mp" : ""}" data-toggle="${esc(o)}" aria-pressed="${S.multi.has(o)}"${locked ? " disabled" : ""}>${i < 9 && !locked ? `<kbd>${i + 1}</kbd>` : ""}${esc(o)}</button>`).join("")}</div>
            ${locked ? "" : `<div class="savebar"><span class="muted">${S.multi.size ? [...S.multi].map(esc).join(", ") : "none"}</span><button class="primary" id="saveMulti">${c.decision != null && JSON.stringify([...S.multi].sort()) === c.decision ? "Saved" : "Save"} <kbd>↵</kbd></button></div>`}`
      : `<div class="seg">${list.map((o, i) => `<button class="sg${o === c.answer ? " mp" : ""}" data-decide="${esc(o)}" aria-pressed="${c.decision === o}"${locked ? " disabled" : ""}>${i < 9 && !locked ? `<kbd>${i + 1}</kbd>` : ""}${esc(lab(o))}</button>`).join("")}</div>`;
  }
  function renderDetail() {
    const c = S.caseView, p = S.data.policy;
    if (!c || c.policy !== p.name) { $("detail").innerHTML = '<div class="d"><div class="empty">Select a case</div></div>'; return; }
    const locked = c.used_in != null, all = opts(c);
    const ids = { scope: c.scope || undefined, trace_id: c.trace_id ?? undefined, conversation_id: c.conversation_id ?? undefined, event_id: c.event_id ?? undefined,
      metadata: Object.keys(c.metadata || {}).length ? c.metadata : undefined };
    const hasIds = Object.values(ids).some(v => v !== undefined);
    $("detail").innerHTML = `<div class="ph"><span class="mono">#${c.id}</span><span class="mono muted">${esc(c.model || "")} · v${esc(c.version)}${c.scope ? " · " + esc(c.scope) : ""}</span><span class="fill"></span>${locked ? `<span class="mono muted">in v${esc(c.used_in)}</span>` : ""}</div>
      <div class="d">

      <button class="linkbtn" id="copy" title="The text as the newest call would send it">${S.copied ? "Copied" : "Copy"}</button>
      ${isDraft ? `<button class="save" data-a="save"${S.busy ? " disabled" : ""} title="Keep this draft as ${labelOf("S")}. It gets no traffic until you give it some in the table.">${S.busy === "save" ? '<span class="spin"></span>Saving…' : `Save as ${labelOf("S")}`}</button>` : ""}</div>
      <div class="jx${S.mode === "raw" ? "" : " refd"}" id="jx">${jsonHtml()}</div>`;
    if (S.mode === "diff") h += `<div class="leg"><span><i class="sw s-a"></i>added</span><span><i class="sw s-d"></i>removed</span><span><i class="ref">#118</i>cases behind it</span></div>`;
    if (S.mode === "tune") h += `<div class="leg"><span><b class="aa">Aa</b>tuneable</span><span><i class="sw s-lk"></i>locked: your code injects it per call</span><span><i class="ref">#118</i>cases behind an edit</span></div>`;

    const cur = verOf(k), results = cur?.replay, failing = results ? results.filter(r => !r.pass).length : 0;
    const n = d.tally.unprocessed + d.tally.processed, rb = S.busy === "replay", tb = S.busy === "tune";
    const tunable = failing && t.ready && (isDraft || !d.draft);
    h += `<div class="replay"><div class="r-head"><div class="r-btns">
        <button class="ghost" data-a="replay" ${!n || S.busy ? "disabled" : ""}>${rb ? '<span class="spin"></span>Replaying…' : ICON.play + "Replay"}</button>
        ${tunable || tb ? `<button class="ghost tune" data-a="tune" ${S.busy ? "disabled" : ""} title="${isDraft ? "Rewrites the draft's tuneable text to fix its misses" : `Writes a draft from ${labelOf(k)} that fixes its misses`}">${tb ? '<span class="spin"></span>Tuning…' : "Auto-tune"}</button>` : ""}
      </div><span class="r-sum">${!n ? "No decided cases" : results ? `<b>${pct(results.length - failing, results.length)}</b> · ${results.length - failing}/${results.length} pass` : "Not run"}</span></div>`;
    if (results?.length) h += `<div class="tiles">${results.map(r => `<button class="tile ${r.pass ? "pass" : "fail"}" data-case="${r.id}" title="#${r.id} · you: ${esc(lab(r.human))} · ${labelOf(k)}: ${esc(r.model == null ? (r.error || "no answer") : lab(r.model))}">${r.id}</button>`).join("")}</div>`;
    const log = isDraft ? cur?.tune : cur?.log?.tune;
    if (log?.length) h += `<ol class="tlog">${log.map(x => `<li><span class="mono muted">${x.round}</span><span class="mono ${x.pass != null && x.pass === x.n ? "okc" : ""}">${x.pass != null ? `${x.pass}/${x.n}` : "—"}</span><span>${esc(x.note)}</span></li>`).join("")}</ol>`;
    h += "</div>";
    $("policy").innerHTML = h; flashSaved = null;
    const inp = $("pcin"); if (inp) { inp.focus(); inp.select(); }
    placeRefs();
  }

  // a share of traffic, as with revisions: the live version keeps what the canaries don't take
  async function setPct(k, kind, p) {
    const was = kind === "traffic" ? traffic(k) : shadowOf(k);
    p = Math.max(0, Math.min(100, Number(p) || 0));
    if (p === was) return renderPane();
    return act("traffic", async () => {
      const r = await post("traffic", { version: k === "S" ? "draft" : k, [kind]: p });
      if (k === "S") S.sel = r.n;
    });
  }

  // hover: where a piece of text comes from
  function showTip(el, ev) {
    const r = RUNS[+el.dataset.r], t = $("tip"); if (!r) return;
    t.innerHTML = tipHtml(r); t.hidden = false; el.classList.add("hov");
    const rects = [...el.getClientRects()], box = rects.find(b => ev.clientY >= b.top - 2 && ev.clientY <= b.bottom + 2) ?? rects[rects.length - 1];
    const w = t.offsetWidth, h = t.offsetHeight, x = Math.max(12, Math.min(innerWidth - w - 12, ev.clientX - 24));
    t.style.left = x + "px"; t.style.top = (box.bottom + 8 + h > innerHeight - 8 ? box.top - h - 8 : box.bottom + 8) + "px";
  }
  function hideTip() { const t = $("tip"); if (t) t.hidden = true; document.querySelectorAll(".hov").forEach(x => x.classList.remove("hov")); }
  $("policy").addEventListener("mouseover", e => { const el = e.target.closest("[data-r]"); hideTip(); if (el && S.mode === "tune") showTip(el, e); });
  $("policy").addEventListener("mouseleave", hideTip);
  $("policy").addEventListener("scroll", hideTip, { passive: true });

  $("policy").addEventListener("click", async e => {
    const t = e.target;
    const pc = t.closest("[data-pct]");
    if (pc && !pc.disabled) { e.stopPropagation(); S.pctEdit = { k: pc.dataset.k === "S" ? "S" : +pc.dataset.k, kind: pc.dataset.pct }; renderPane(); return; }
    if (t.closest(".pc.edit")) return;
    const md = t.closest("[data-mode]");
    if (md && !md.disabled) { S.mode = S.mode === md.dataset.mode ? "raw" : md.dataset.mode; renderPane(); return; }
    const rv = t.closest("tr[data-rv]");
    if (rv) { const k = rv.dataset.rv === "S" ? "S" : +rv.dataset.rv; if (k !== S.sel) { S.sel = k; S.editing = null; syncText(); } renderPane(); return; }
    const a = t.closest("[data-a]");
    if (a?.dataset.a === "save") return act("save", async () => { const r = await post("save"); S.sel = r.n; flashSaved = r.n; });
    const df = t.closest("[data-differs]");
    if (df) { S.tab = "calls"; S.review = false; S.calls.q = `differs:${df.dataset.differs}`; S.calls.rows = null; renderList(); await loadCalls(); renderList(); return; }
    if (a?.dataset.a === "replay") return act("replay", () => post("replay", { target: S.sel === "S" ? "draft" : S.sel }));
    if (a?.dataset.a === "tune") return act("tune", async () => {
      await post("tune", S.sel === "S" ? {} : { from: S.sel }); S.sel = "S"; S.mode = "diff";
    });
  });
  $("policy").addEventListener("keydown", e => {
    if (e.target.id !== "pcin" || !S.pctEdit) return;
    if (e.key === "Enter") { e.preventDefault(); const { k, kind } = S.pctEdit; S.pctEdit = null; setPct(k, kind, e.target.value); }
    if (e.key === "Escape") { S.pctEdit = null; renderPane(); }
  });
  $("policy").addEventListener("focusout", e => {
    if (e.target.id !== "pcin" || !S.pctEdit) return;
    const { k, kind } = S.pctEdit, v = e.target.value; S.pctEdit = null;
    setTimeout(() => setPct(k, kind, v));
  });


  // ---------------- actions ----------------
  async function act(kind, fn) {
    S.busy = kind; S.error = null; renderPolicy();
    try { await fn(); } catch (e) { S.error = e.message; }
    S.busy = null;
    await load();
    renderPolicy();
  }

  const opts = c => (c.options?.length ? c.options : S.data.policy.options);
  const toggle = o => { S.multi.has(o) ? S.multi.delete(o) : S.multi.add(o); if ($("seg")) $("seg").innerHTML = segHtml(S.caseView); };

  async function decideCur(value) {
    const id = S.cur, v = typeof value === "string" ? value : JSON.stringify([...value].sort());
    // you stay on the case: the button you press keeps its colour and the row gets its tick; j/k or a click moves on
    if (S.caseView?.id === id) { S.caseView.decision = v; renderDetail(); }
    try { await api(`/api/cases/${id}/decide`, { value }); }
    catch (e) { await open(id, false); renderPolicy(); throw e; }
    if (S.tab === "calls") { const r = S.calls.rows?.find(c => c.id === id); if (r) { r.decision = v; S.calls.kept?.add(id); } }
    await load();
    if (S.cur === id) await open(id, false);
    renderPolicy();
  }

  async function startEdit() {
    if (S.text?.sel !== S.sel) await loadText();
    S.editing = { ...S.text.edit }; S.editSample = S.text.sample; S.error = null; renderPane();
    document.querySelector("#editForm textarea")?.focus();
  }

  document.addEventListener("change", e => {
    const ck = e.target.closest("[data-pick]");
    if (ck) {
      const id = +ck.dataset.pick;
      if (S.pickAll) { S.pickAll = false; S.data.unprocessed.forEach(c => S.pick.add(c.id)); }
      ck.checked ? S.pick.add(id) : S.pick.delete(id); renderList(); return;
    }
    if (e.target.id === "scope") go(S.name, e.target.value);
  });
  let typing;
  document.addEventListener("input", e => {
    if (e.target.id === "of") { S.ofilter = e.target.value; if (S.caseView) $("seg").innerHTML = segHtml(S.caseView); return; }
    if (e.target.id !== "cq") return;
    clearTimeout(typing);
    typing = setTimeout(async () => {
      S.calls.q = e.target.value; await loadCalls();
      const el = $("cq"), pos = el.selectionStart; renderList(); const n = $("cq"); n.focus(); n.setSelectionRange(pos, pos);
    }, 250);
  });
  document.addEventListener("click", async e => {
    const t = e.target;
    if (t.closest("[data-pick]")) return;
    const o = t.closest("[data-open]"); if (o) { go(o.dataset.open, ""); return; }
    if (t.closest("#home")) { location.hash = "#/"; return; }
    const tab = t.closest("[data-tab]");
    if (tab) { S.tab = tab.dataset.tab; if (S.tab === "calls" && !S.calls.rows) { renderList(); await loadCalls(); } renderList(); return; }
    if (t.closest("#more")) { await loadCalls(true); renderList(); return; }
    if (t.closest("#review")) {
      S.review = !S.review; S.calls.rows = null; renderList(); await loadCalls(); renderList();
      const f = invocations()[0]; if (S.review && f && !invocations().some(c => c.id === S.cur)) await open(f.id);
      return;
    }
    const ok = t.closest("[data-ok]");
    if (ok) {
      const c = (S.calls.rows || []).find(x => x.id === +ok.dataset.ok) ?? S.data.queue.find(x => x.id === +ok.dataset.ok);
      if (!c) return refresh();
      if (S.cur !== c.id) await open(c.id, false);
      return decideCur(S.data.policy.kind === "multi" ? set(c.answer) : c.answer);
    }
    const dc = t.closest("[data-decide]");
    if (dc && !dc.disabled) return decideCur(dc.dataset.decide);
    const tg = t.closest("[data-toggle]");
    if (tg && !tg.disabled) return toggle(tg.dataset.toggle);
    if (t.closest("#saveMulti")) return decideCur([...S.multi]);
    const cs = t.closest("[data-case]"); if (cs) { await open(+cs.dataset.case); return; }
    if (t.closest("#pickAll")) { S.pickAll = true; renderList(); return; }
    if (t.closest("#copy")) {
      const m = Object.entries(S.text?.merged || {});
      try { await navigator.clipboard.writeText(m.length === 1 ? m[0][1] : m.map(([k, x]) => `## ${k}\n\n${x}`).join("\n\n")); S.copied = true; } catch { S.error = "The browser didn't allow copying here"; }
      renderPane(); setTimeout(() => { S.copied = false; if (!S.editing) renderPane(); }, 1500); return;
    }
    if (t.closest("#suggest")) return act("suggest", async () => {
      await post("suggest", S.pickAll ? { all: true } : { cases: [...S.pick] }); S.pick.clear(); S.pickAll = false; S.sel = "S";
    });
    if (t.closest("#edit")) return startEdit();
    if (t.closest("#editCancel")) { S.editing = null; renderPane(); return; }
    if (t.closest("#editSave")) {
      const parts = Object.fromEntries([...document.querySelectorAll("#editForm textarea")].map(x => [x.name, x.value]));
      S.editing = null;
      return act("edit", async () => { const s = await post("edit", { parts, sample: S.editSample }); if (s) S.sel = "S"; });
    }
    if (t.closest("#rebase")) return act("rebase", async () => { const r = await post("rebase"); S.sel = r.live; });
    if (t.closest("#discard")) return act("discard", async () => { await post("discard"); S.sel = null; });
    if (t.closest("#inherit")) return act("live", async () => { await post("live", { version: null }); S.sel = null; });
  });

  // j/k move · 1–9 decide · Enter agrees with the model · x picks · / filters calls
  document.addEventListener("keydown", e => {
    if (S.view !== "policy" || !S.data || e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) { if (e.key === "Escape") e.target.blur(); return; }
    const list = rowsNow(), i = list.findIndex(c => c.id === S.cur);
    const c = S.caseView, free = c && c.policy === S.data.policy.name && c.used_in == null;
    if (e.key === "j" || e.key === "ArrowDown" || e.key === "k" || e.key === "ArrowUp") {
      const step = e.key === "j" || e.key === "ArrowDown" ? 1 : -1, next = list[Math.max(0, Math.min(list.length - 1, i + step))];
      if (next) { e.preventDefault(); open(next.id); }
    } else if (/^[1-9]$/.test(e.key) && free) {
      const o = shownOpts(c)[+e.key - 1];
      if (o) { e.preventDefault(); S.data.policy.kind === "multi" ? toggle(o) : decideCur(o); }
    } else if (e.key === "Enter" && free && S.data.policy.kind === "multi" && !e.target.closest("button:not(.rb)")) {
      e.preventDefault(); decideCur([...S.multi]);
    } else if (e.key === "Enter" && free && c.answer != null && c.decision == null && !e.target.closest("button:not(.rb)")) {
      e.preventDefault(); decideCur(c.answer);
    } else if (e.key === "x" && S.tab === "decided" && free && c.decision != null) {
      if (S.pickAll) { S.pickAll = false; S.data.unprocessed.forEach(x => S.pick.add(x.id)); }
      S.pick.has(c.id) ? S.pick.delete(c.id) : S.pick.add(c.id); renderList();
    } else if (e.key === "/") {
      e.preventDefault(); S.tab = "calls"; (S.calls.rows ? Promise.resolve() : loadCalls()).then(() => { renderList(); $("cq")?.focus(); });
    }
  });

  route();
})();
</script>
</body>
</html>
